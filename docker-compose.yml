# Local infrastructure for WEB_TLN (Redis for concurrent sessions).
# Usage (from repo root):
#   docker compose up -d
# Or from BE:
#   pwsh ./scripts/ensure-redis.ps1

services:
  redis:
    image: redis:7-alpine
    container_name: tln-redis
    ports:
      - "6379:6379"
    volumes:
      - tln_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  tln_redis_data:
